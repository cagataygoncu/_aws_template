name: {{PROJECT_NAME}}
channels:
    - conda-forge
    - nodefaults
dependencies:
    # Same versions as the base image; both are synced from elixir and erlang
    # in mise.toml.
    # conda-forge no longer ships elixir 1.17, which is why both are on 1.19.
    # mise-sync: - elixir=${mise:elixir}
    - elixir=${mise:elixir}
    # mise-sync: - erlang=${mise:erlang}
    - erlang=${mise:erlang}
