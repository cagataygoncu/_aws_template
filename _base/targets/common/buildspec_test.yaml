version: 0.2

cache:
  paths:
    - '/root/.cache/pip/**/*'

phases:
  install:
    runtime-versions:
      python: 3.12
    commands: |
      echo "TEST_REPORT_DIRECTORY = ${TEST_REPORT_DIRECTORY}"
      echo "TEST_REPORT_FILENAME = ${TEST_REPORT_FILENAME}"

      echo "Running test phase"

      echo "Retrieving SSH key from Secrets Manager"
      SSH_KEY=$(aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:ap-southeast-2:095841671171:secret:gig_service_template_github --query SecretString --output text)
      mkdir -p ~/.ssh
      echo "$SSH_KEY" > ~/.ssh/id_rsa
      chmod 600 ~/.ssh/id_rsa
      eval "$(ssh-agent -s)"
      ssh-add ~/.ssh/id_rsa
      ssh-add -L
      ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      echo "Pip install requirements"
      pip install -r tests/requirements.txt
      pip install -r requirements.txt
  build:
    commands: |
      python -m pytest . --junitxml=${TEST_REPORT_DIRECTORY}/${TEST_REPORT_FILENAME}
reports:
  coverage:
    files:
      - ${TEST_REPORT_FILENAME}
    base-directory: ${TEST_REPORT_DIRECTORY}
    file-format: JUNITXML
artifacts:
  files:
    - ${TEST_REPORT_DIRECTORY}/${TEST_REPORT_FILENAME}