version: 0.2

# The pipeline's test stage (RunTests in cicd_parameters.json). It runs
# `make test` - the same command a developer runs: the unit tests inside the
# service base image, at the versions in mise.toml, whatever the language.
# This CodeBuild project runs in privileged mode, so Docker is available.
# A project without unit tests yet (an empty TEST_COMMAND) passes with a note.

phases:
  build:
    # One block, one shell: the ssh agent started here is still running when
    # make test needs it for private git dependencies.
    commands: |
      echo "TEST_REPORT_DIRECTORY = ${TEST_REPORT_DIRECTORY}"
      echo "TEST_REPORT_FILENAME = ${TEST_REPORT_FILENAME}"

      # Private GitHub repositories: GITHUB_TOKEN when the pipeline stack has
      # GitHubTokenSecretArn; otherwise the ssh key, forwarded by make test.
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "Retrieving SSH key from Secrets Manager"
        SSH_KEY=$(aws secretsmanager get-secret-value --secret-id arn:aws:secretsmanager:ap-southeast-2:095841671171:secret:gig_service_template_github --query SecretString --output text)
        mkdir -p ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa
        ssh-add -L
        ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      fi

      echo "Running the unit tests: make test"
      ./make/commands.sh test

reports:
  coverage:
    files:
      - ${TEST_REPORT_FILENAME}
    base-directory: ${TEST_REPORT_DIRECTORY}
    file-format: JUNITXML
artifacts:
  files:
    - ${TEST_REPORT_DIRECTORY}/${TEST_REPORT_FILENAME}
