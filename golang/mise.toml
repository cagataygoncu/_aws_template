# mise.toml - the tool versions this project is built and developed with.
#
# The one place a version is written. Everything else reads it from here:
# the deployed base images (BaseImageURI in targets/*/cicd_parameters.json,
# expanded at build time), and every file with a `mise-sync:` comment, which
# `make sync-versions` rewrites. `make lint` fails while any of them disagree.
#
# To move a version: edit it here, then `make sync-versions`.
# `make local-dev-setup` installs everything below with `mise install`. A
# library mise cannot install (a C library, say) goes in
# system_packages.txt or system_packages_build.txt instead: the devcontainer
# and the deployed images install those.

[tools]
# 1.26 is the floor: aws-lambda-go v1.55 and gopls both require it.
go = "1.26"

# Command-line tools `make lint` and the editor use, pinned so every machine
# lints with the same versions. `uv` lets mise install Python tools (pipx:)
# without a project Python. To move them: `mise outdated`, then edit the
# versions here (or `mise upgrade --bump`) and commit.
uv = "0.13.9"
"pipx:cfn-lint" = "1.60.1"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:github.com/go-delve/delve/cmd/dlv" = "1.27.2"

[env]
# Private modules (gig_utils_go and the rest of github.com/GIGTennis): go must
# not ask the public proxy or checksum database for them, and git must fetch
# them over ssh. Set only inside this project, by mise - nothing global.
GOPRIVATE = "github.com/GIGTennis/*"
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "url.git@github.com:GIGTennis/.insteadOf"
GIT_CONFIG_VALUE_0 = "https://github.com/GIGTennis/"
